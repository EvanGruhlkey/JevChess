[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-chess"
version = "0.1.0"
description = "Play chess against Jev"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "python-chess>=1.999,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["jevchess"]

